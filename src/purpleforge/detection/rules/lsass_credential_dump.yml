id: PF-R-0002
title: LSASS Memory Access with Credential Dump Rights
description: >
  Detects a process opening lsass.exe with access masks that permit memory
  reading. Matches on the access mask rather than on process name, so renaming
  the dumper binary does not evade it -- which is exactly the evasion the APT29
  scenario uses.
level: critical
source: handwritten
tags:
  - attack.credential-access
  - attack.t1003.001
references:
  - https://attack.mitre.org/techniques/T1003/001/

detection:
  selection_target:
    event_type: "process_access"
    process.target_name|endswith: "lsass.exe"
  selection_access:
    process.granted_access|in:
      - "0x1FFFFF"
      - "0x1F0FFF"
      - "0x1F1FFF"
      - "0x143A"
      - "0x1410"
      - "0x1438"
  filter_known_good:
    process.name|endswith:
      - "MsMpEng.exe"
      - "wmiprvse.exe"
      - "csrss.exe"

condition: selection_target and selection_access and not filter_known_good

falsepositives:
  - Endpoint protection engines reading LSASS for scanning
  - Approved crash-dump collection during incident response
