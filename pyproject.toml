[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "purpleforge"
version = "1.0.0"
description = "Purple-team adversary emulation and detection validation platform with AI-assisted detection engineering"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PurpleForge" }]
keywords = ["purple-team", "detection-engineering", "mitre-attack", "sigma", "adversary-emulation"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Information Technology",
  "Topic :: Security",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "pyyaml>=6.0",
  "rich>=13.0",
  "jinja2>=3.1",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
purpleforge = "purpleforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
purpleforge = [
  "detection/rules/*.yml",
  "detection/correlations/*.yml",
  "emulation/scenarios/*.yml",
  "reporting/templates/*.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
